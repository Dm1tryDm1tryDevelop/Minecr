<style>

</style></head><body>
<div id="hint">Загрузка…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=()=>innerWidth,H=()=>innerHeight;
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(W(),H());
document.body.prepend(R.domElement);R.domElement.style.touchAction='none';
R.shadowMap.enabled=true;const S=new THREE.Scene();S.background=new THREE.Color(0x9fd3ff);S.fog=new THREE.Fog(0x9fd3ff,14,44);
const cam=new THREE.PerspectiveCamera(60,W()/H(),.1,70);
const hemi=new THREE.HemisphereLight(0xffffff,0x778899,.9);S.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(10,20,8);S.add(sun,sun.target);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:70});

// player (minecraft-style)
function mkTex(f,h=16){const c=document.createElement('canvas');c.width=16;c.height=h;const x=c.getContext('2d');f(x);const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const rn=(x,base,v)=>{for(let i=0;i<16;i++)for(let j=0;j<16;j++){const c=new THREE.Color(base).multiplyScalar(1-Math.random()*v);x.fillStyle='#'+c.getHexString();x.fillRect(i,j,1,1)}};
const lm=t=>new THREE.MeshLambertMaterial({map:t});
const skinT=mkTex(x=>rn(x,0xc48e68,.08)),shirtT=mkTex(x=>rn(x,0x1fb5b5,.2)),pantsT=mkTex(x=>rn(x,0x3b4cc0,.2)),shoeT=mkTex(x=>rn(x,0x666666,.2)),hairT=mkTex(x=>rn(x,0x3b2713,.25));
const hp=(x,a,b,w,h)=>{for(let i=a;i<a+w;i++)for(let j=b;j<b+h;j++){const c=new THREE.Color(0x3b2713).multiplyScalar(1-Math.random()*.25);x.fillStyle='#'+c.getHexString();x.fillRect(i,j,1,1)}};
const faceT=mkTex(x=>{rn(x,0xc48e68,.08);hp(x,0,0,16,4);hp(x,0,4,4,2);hp(x,12,4,4,2);hp(x,0,6,2,2);hp(x,14,6,2,2);
 x.fillStyle='#eeeeee';x.fillRect(2,8,2,2);x.fillRect(12,8,2,2);x.fillStyle='#3a2f8a';x.fillRect(4,8,2,2);x.fillRect(10,8,2,2);
 x.fillStyle='#6e4030';x.fillRect(6,12,4,2)});
const sideMk=f=>mkTex(x=>{rn(x,0xc48e68,.08);hp(x,0,0,16,6);if(f){hp(x,0,6,10,6);hp(x,14,6,2,2)}else{hp(x,6,6,10,6);hp(x,0,6,2,2)}});
const sideR=sideMk(false),sideL=sideMk(true);
const limb=(parts,px,py)=>{const g=new THREE.Group();parts.forEach(a=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a[0],a[1],a[2]),lm(a[3]));m.position.y=a[4];g.add(m)});g.position.set(px,py,0);return g};
// chunks
let RD=3;const CH=16,gt=mkTex(x=>rn(x,0x4aa83c,.3));gt.repeat.set(CH,CH);
const gm=new THREE.MeshLambertMaterial({map:gt}),gg=new THREE.PlaneGeometry(CH,CH);gg.rotateX(-Math.PI/2);
const chunks=new Map();let lcx=1e9,lcz=1e9;
function updChunks(){const cx=Math.floor(P.position.x/CH),cz=Math.floor(P.position.z/CH);if(cx===lcx&&cz===lcz)return;lcx=cx;lcz=cz;
 for(const [k,m] of chunks)if(Math.abs(m.userData.cx-cx)>RD||Math.abs(m.userData.cz-cz)>RD){S.remove(m);chunks.delete(k)}
 for(let i=-RD;i<=RD;i++)for(let j=-RD;j<=RD;j++){const k=(cx+i)+','+(cz+j);if(!chunks.has(k)){const m=new THREE.Mesh(gg,gm);m.position.set((cx+i+.5)*CH,0,(cz+j+.5)*CH);m.receiveShadow=true;m.userData={cx:cx+i,cz:cz+j};S.add(m);chunks.set(k,m)}}}
const P=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(.8,.9,.4),lm(shirtT));body.position.y=1.35;
const head=new THREE.Mesh(new THREE.BoxGeometry(.6,.6,.6),[lm(sideR),lm(sideL),lm(hairT),lm(skinT),lm(faceT),lm(hairT)]);head.position.y=2.1;
const armL=limb([[.38,.5,.38,shirtT,-.25],[.38,.4,.38,skinT,-.7]],-.59,1.8),armR=limb([[.38,.5,.38,shirtT,-.25],[.38,.4,.38,skinT,-.7]],.59,1.8);
const legL=limb([[.38,.7,.38,pantsT,-.35],[.38,.2,.38,shoeT,-.8]],-.19,.9),legR=limb([[.38,.7,.38,pantsT,-.35],[.38,.2,.38,shoeT,-.8]],.19,.9);
const rig=new THREE.Group();rig.position.y=.9;P.add(rig);[body,head,armL,armR,legL,legR].forEach(m=>{m.position.y-=.9;rig.add(m)});
P.position.set(0,0,6);P.traverse(o=>o.castShadow=true);S.add(P);

// blocks
const blocks=[],geo=new THREE.BoxGeometry(1,1,1);
const pal=[0xe74c3c,0x3498db,0xf1c40f,0x2ecc71,0x9b59b6,0xecf0f1,0xe67e22,0x8d6e63];let pi=0;
const TEX={
 wood:x=>{rn(x,0xb88a4a,.3);x.fillStyle='#7a5a2a';[3,7,11,15].forEach(j=>x.fillRect(0,j,16,1))},
 brick:x=>{rn(x,0xa8452f,.3);x.fillStyle='#d8d0c4';for(let r=0;r<4;r++){x.fillRect(0,r*4+3,16,1);[r%2?3:7,r%2?11:15].forEach(v=>x.fillRect(v,r*4,1,3))}},
